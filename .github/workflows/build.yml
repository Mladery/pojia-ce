name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定版本：换 PyInstaller 版本会改变产物行为（引导器、onefile 解包方式），
  # 出问题时要能确定是"代码改了"还是"打包器变了"。
  PYINSTALLER_VERSION: "6.16.0"
  BIN_NAME: pojia-ce

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # 四种产物覆盖绝大多数人：Windows x64、Linux x64、Intel Mac、Apple Silicon Mac。
        # Intel Mac 用 macos-15-intel —— macos-13 已经不在受支持列表里（GitHub 现在只
        # 提供 macos-15-intel / macos-26-intel 两个 x64 镜像），留着它会在队列里躺几十分钟。
        include:
          - { os: windows-latest,  py: "3.11", asset: windows-x64, ext: ".exe" }
          - { os: ubuntu-latest,   py: "3.11", asset: linux-x64,   ext: ""     }
          - { os: macos-15-intel,  py: "3.11", asset: macos-x64,   ext: ""     }
          - { os: macos-latest,    py: "3.11", asset: macos-arm64, ext: ""     }

    env:
      # Windows runner 的控制台编码是 cp1252/cp936。冒烟步骤要打印产物的
      # --version 输出（含中文），不强制 UTF-8 会直接 UnicodeEncodeError ——
      # 第一次跑就栽在这儿，产物本身是好的，是打印炸了。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      - name: 打包
        shell: bash
        run: |
          # 构建产物全部落在 build/ 下（已 gitignore），仓库根目录保持干净。
          # specpath 必须和脚本同盘：PyInstaller 会用 relpath 算相对路径，
          # 跨盘符直接 ValueError（本机踩过，J: 源码 + C: 临时目录）。
          python -m PyInstaller \
            --onefile --clean --noconfirm \
            --name "$BIN_NAME" \
            --distpath build/dist \
            --workpath build/work \
            --specpath build \
            src/破甲一键通.py
          ls -lh "build/dist/$BIN_NAME${{ matrix.ext }}"

      - name: 签名（Windows，配了证书才签）
        if: matrix.asset == 'windows-x64'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PW: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          # 没配证书就跳过 —— 产物照样能用，只是属性页显示「未知发布者」。
          if (-not $env:PFX_B64) {
            Write-Host "::notice::没有配置 WINDOWS_SIGNING_PFX_BASE64，跳过签名"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "signing"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pfx = Join-Path $dir "pojia-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          # 密码走文件而不是命令行参数：进程参数在 runner 上对任何进程可见。
          [IO.File]::WriteAllText(
            (Join-Path $dir "pojia-signing-密码.txt"),
            $env:PFX_PW,
            (New-Object System.Text.UTF8Encoding($false)))

          # 调仓库里的脚本，不在这里重写一遍 signtool 查找逻辑 —— 用户本机跑的是
          # 它，CI 跑的也该是它。signtool 不在 PATH 上是常态，脚本里会去找 Windows Kits。
          & .\tools\sign-windows.ps1 -Exe "build/dist/pojia-ce.exe" -Pfx $pfx
          if ($LASTEXITCODE -ne 0) { throw "签名失败（sign-windows.ps1 退出码 $LASTEXITCODE）" }

          # 用仓库里那份验签脚本，而不是在这里重写一遍比对逻辑 —— 让 CI 走的就是
          # 用户拿到手会走的那条路。顺带把「secret 里的 pfx」和「仓库钉的公钥证书」
          # 对一次：证书轮换了却忘了更新 tools/codesign/，这里立刻红。
          & .\tools\verify-windows.ps1 -Exe "build/dist/pojia-ce.exe"
          if ($LASTEXITCODE -ne 0) { throw "验签不通过：签名者与仓库钉定的证书不一致" }

          Remove-Item -Recurse -Force $dir
          Write-Host "签名 OK"

      - name: 冒烟：产物能跑、版本号对
        shell: python
        run: |
          import glob, os, subprocess, sys
          # 再兜一层：即便 env 没生效，也别让"打印中文"把这一步搞挂。
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          cands = [p for p in glob.glob(os.path.join("build", "dist", "*"))
                   if os.path.isfile(p)]
          assert len(cands) == 1, "expected exactly one binary, got %r" % (cands,)
          exe = cands[0]
          if os.name != "nt":
              os.chmod(exe, 0o755)

          r = subprocess.run([exe, "--version"], capture_output=True, text=True,
                             encoding="utf-8", errors="replace", timeout=180)
          print("--version exit=%s stdout=%r" % (r.returncode, r.stdout.strip()))
          assert r.returncode == 0, "--version failed: %r" % (r.stderr,)
          assert "CE" in r.stdout, "version output missing CE: %r" % (r.stdout,)

          # --help 会把目标列表拼出来，顺带确认注册表在冻结态也是完整的
          r2 = subprocess.run([exe, "--help"], capture_output=True, text=True,
                              encoding="utf-8", errors="replace", timeout=180)
          assert r2.returncode == 0, "--help failed: %r" % (r2.stderr,)
          assert "kiro" in r2.stdout, "--help 里没列出 kiro"
          print("smoke OK, size=%d bytes" % os.path.getsize(exe))

      - name: 改名
        shell: bash
        run: |
          mkdir -p out
          cp "build/dist/$BIN_NAME${{ matrix.ext }}" \
             "out/$BIN_NAME-${{ matrix.asset }}${{ matrix.ext }}"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      # 打 tag 时才发 Release。先 view 再 create，多个 job 并发跑也不会互相踩；
      # 上传用 --clobber，重跑同一个 tag 能覆盖旧产物。
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes \
            || true
          gh release upload "$TAG" "out/$BIN_NAME-${{ matrix.asset }}${{ matrix.ext }}" --clobber

  # 四个平台的产物汇总成一份校验和。Windows 走签名验签，另外三个平台只有
  # SHA-256 这一条路 —— 所以这份文件是它们唯一的完整性凭据。
  checksums:
    name: checksums
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 SHA256SUMS.txt
        run: |
          cd artifacts
          ls -la
          sha256sum ./* > SHA256SUMS.txt
          echo "---- SHA256SUMS.txt ----"
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: 校验和也发到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes \
            || true
          gh release upload "$TAG" artifacts/SHA256SUMS.txt --clobber
